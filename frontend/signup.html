<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LifeDrop - Sign Up</title>


  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }


    body{

      min-height:100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(198,40,61,.28),
          transparent 30%
        ),

        radial-gradient(
          circle at 85% 80%,
          rgba(198,40,61,.20),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #080b10,
          #111722,
          #180c11
        );

      color:#fff;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:30px;

      overflow-x:hidden;

    }


    /* BACKGROUND BLOOD DROPS */

    .drop{

      position:fixed;

      width:90px;

      height:110px;

      background:#c6283d;

      opacity:.10;

      border-radius:
        50% 50% 55% 55% /
        45% 45% 65% 65%;

      transform:rotate(45deg);

      filter:blur(1px);

    }


    .drop.one{

      top:8%;

      left:7%;

      width:80px;

      height:95px;

    }


    .drop.two{

      bottom:8%;

      right:8%;

      width:120px;

      height:140px;

    }


    .drop.three{

      top:48%;

      right:25%;

      width:55px;

      height:70px;

      opacity:.06;

    }


    /* MAIN CARD */

    .signup-card{

      width:100%;

      max-width:520px;

      background:
        rgba(20,26,35,.94);

      border:

        1px solid

        rgba(255,255,255,.10);

      border-radius:24px;

      padding:34px;

      box-shadow:

        0 25px 80px
        rgba(0,0,0,.55);

      position:relative;

      z-index:2;

      backdrop-filter:blur(12px);

    }


    /* LOGO */

    .logo{

      display:flex;

      justify-content:center;

      align-items:center;

      gap:12px;

      margin-bottom:10px;

    }


    .logo-drop{

      width:38px;

      height:48px;

      background:#c6283d;

      border-radius:
        50% 50% 55% 55% /
        45% 45% 65% 65%;

      transform:rotate(45deg);

      box-shadow:

        0 8px 25px
        rgba(198,40,61,.35);

    }


    .logo-text{

      font-size:28px;

      font-weight:800;

      letter-spacing:.3px;

    }


    .subtitle{

      text-align:center;

      color:#9da8b6;

      margin-bottom:28px;

      line-height:1.5;

    }


    /* FORM */

    .form{

      display:flex;

      flex-direction:column;

      gap:15px;

    }


    .row{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:14px;

    }


    .field{

      display:flex;

      flex-direction:column;

      gap:7px;

    }


    .field label{

      font-size:13px;

      font-weight:700;

      color:#dbe1e8;

    }


    .field input,
    .field select{

      width:100%;

      padding:13px 14px;

      border-radius:10px;

      border:

        1px solid
        #303b4a;

      background:#0e141c;

      color:#fff;

      outline:none;

      font-size:14px;

      transition:.2s;

    }


    .field input::placeholder{

      color:#667383;

    }


    .field input:focus,
    .field select:focus{

      border-color:#c6283d;

      box-shadow:

        0 0 0 3px
        rgba(198,40,61,.12);

    }


    .field select{

      cursor:pointer;

    }


    /* BUTTON */

    .btn{

      width:100%;

      border:0;

      border-radius:11px;

      padding:14px;

      background:#c6283d;

      color:white;

      font-size:15px;

      font-weight:800;

      cursor:pointer;

      margin-top:5px;

      transition:.2s;

    }


    .btn:hover{

      background:#a91f32;

      transform:translateY(-1px);

    }


    .btn:disabled{

      opacity:.6;

      cursor:not-allowed;

      transform:none;

    }


    /* OTP */

    #otpSection{

      display:none;

      margin-top:5px;

      padding-top:18px;

      border-top:

        1px solid
        #2b3542;

    }


    #otpSection.show{

      display:block;

    }


    .otp-info{

      background:

        rgba(198,40,61,.08);

      border:

        1px solid
        rgba(198,40,61,.25);

      border-radius:10px;

      padding:12px;

      margin-bottom:14px;

      color:#cbd3dc;

      font-size:13px;

      line-height:1.5;

    }


    .otp-input{

      text-align:center;

      letter-spacing:8px;

      font-size:20px !important;

      font-weight:800;

    }


    /* MESSAGE */

    #message{

      min-height:20px;

      text-align:center;

      margin-top:12px;

      font-size:13px;

      color:#cbd3dc;

    }


    /* LOGIN */

    .login-text{

      text-align:center;

      margin-top:22px;

      color:#8e9aaa;

      font-size:14px;

    }


    .login-text a{

      color:#e33a52;

      font-weight:800;

      text-decoration:none;

    }


    .login-text a:hover{

      text-decoration:underline;

    }


    /* BACK */

    .back{

      position:absolute;

      top:18px;

      left:20px;

      color:#9da8b6;

      text-decoration:none;

      font-size:13px;

    }


    .back:hover{

      color:#fff;

    }


    /* SECURITY TEXT */

    .security{

      text-align:center;

      margin-top:15px;

      color:#687585;

      font-size:12px;

    }


    /* MOBILE */

    @media(max-width:600px){

      body{

        padding:15px;

      }


      .signup-card{

        padding:25px 20px;

        border-radius:18px;

      }


      .row{

        grid-template-columns:1fr;

      }


      .logo-text{

        font-size:25px;

      }

    }

  </style>

</head>


<body>


<!-- BACKGROUND -->

<div class="drop one"></div>

<div class="drop two"></div>

<div class="drop three"></div>


<!-- SIGNUP CARD -->

<div class="signup-card">


  <a
    href="/"
    class="back"
  >
    ← Back to Home
  </a>


  <!-- LOGO -->

  <div class="logo">

    <div class="logo-drop"></div>

    <div class="logo-text">
      LifeDrop
    </div>

  </div>


  <p class="subtitle">

    Create your LifeDrop account
    and help make blood access easier.

  </p>


  <!-- SIGNUP FORM -->

  <form
    id="signupForm"
    class="form"
  >


    <!-- NAME + PHONE -->

    <div class="row">


      <div class="field">

        <label>
          Full Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Enter your name"
          required
        >

      </div>


      <div class="field">

        <label>
          Phone Number
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="Enter phone number"
          required
        >

      </div>

    </div>


    <!-- EMAIL + BLOOD GROUP -->

    <div class="row">


      <div class="field">

        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="field">

        <label>
          Blood Group
        </label>

        <select
          id="bloodGroup"
          required
        >

          <option value="">
            Select blood group
          </option>

          <option value="O+">
            O+
          </option>

          <option value="O-">
            O-
          </option>

          <option value="A+">
            A+
          </option>

          <option value="A-">
            A-
          </option>

          <option value="B+">
            B+
          </option>

          <option value="B-">
            B-
          </option>

          <option value="AB+">
            AB+
          </option>

          <option value="AB-">
            AB-
          </option>

        </select>

      </div>

    </div>


    <!-- PASSWORD -->

    <div class="row">


      <div class="field">

        <label>
          Password
        </label>

        <input
          id="password"
          type="password"
          minlength="6"
          placeholder="Minimum 6 characters"
          required
        >

      </div>


      <div class="field">

        <label>
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="6"
          placeholder="Re-enter password"
          required
        >

      </div>

    </div>


    <!-- SIGNUP BUTTON -->

    <button
      id="signupBtn"
      class="btn"
      type="submit"
    >

      Send OTP

    </button>


  </form>


  <!-- OTP SECTION -->

  <div
    id="otpSection"
  >

    <div class="otp-info">

      📩 A 6-digit OTP has been sent
      to your email address.
      Enter it below to create your account.

    </div>


    <form
      id="otpForm"
      class="form"
    >

      <div class="field">

        <label>
          Email Verification OTP
        </label>

        <input
          id="otp"
          class="otp-input"
          type="text"
          inputmode="numeric"
          maxlength="6"
          pattern="[0-9]{6}"
          placeholder="000000"
          required
        >

      </div>


      <button
        id="verifyBtn"
        class="btn"
        type="submit"
      >

        Verify OTP & Create Account

      </button>

    </form>

  </div>


  <!-- MESSAGE -->

  <div id="message"></div>


  <!-- LOGIN -->

  <div class="login-text">

    Already have an account?

    <a href="/">
      Login
    </a>

  </div>


  <div class="security">

    🔒 Your account information is securely processed.

  </div>


</div>


<script>

const signupForm =
  document.getElementById(
    'signupForm'
  );


const otpForm =
  document.getElementById(
    'otpForm'
  );


const otpSection =
  document.getElementById(
    'otpSection'
  );


const message =
  document.getElementById(
    'message'
  );


let signupEmail = '';


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(
  text,
  type='normal'
){

  message.textContent =
    text;


  if(type === 'error'){

    message.style.color =
      '#ff667b';

  }

  else if(type === 'success'){

    message.style.color =
      '#36c98f';

  }

  else{

    message.style.color =
      '#cbd3dc';

  }

}


/* =========================
   SIGNUP
========================= */

signupForm.addEventListener(
  'submit',
  async function(event){

    event.preventDefault();


    const name =
      document
        .getElementById('name')
        .value
        .trim();


    const phone =
      document
        .getElementById('phone')
        .value
        .trim();


    const email =
      document
        .getElementById('email')
        .value
        .trim()
        .toLowerCase();


    const bloodGroup =
      document
        .getElementById('bloodGroup')
        .value;


    const password =
      document
        .getElementById('password')
        .value;


    const confirmPassword =
      document
        .getElementById('confirmPassword')
        .value;


    /* PASSWORD CHECK */

    if(password.length < 6){

      showMessage(
        'Password must be at least 6 characters.',
        'error'
      );

      return;

    }


    if(password !== confirmPassword){

      showMessage(
        'Passwords do not match.',
        'error'
      );

      return;

    }


    if(!bloodGroup){

      showMessage(
        'Please select your blood group.',
        'error'
      );

      return;

    }


    const normalizedPhone = phone.replace(/\D/g,'');

    if(normalizedPhone.length < 10 || normalizedPhone.length > 15){
      showMessage('Please enter a valid phone number.', 'error');
      return;
    }


    const button =
      document.getElementById(
        'signupBtn'
      );


    button.disabled = true;

    button.textContent =
      'Sending OTP...';


    showMessage(
      'Please wait...'
    );


    try{


      /*
        Phone and bloodGroup are collected
        here for the signup UI.

        Backend also stores phone and bloodGroup
        with the verified account.
      */

      const response =
        await fetch(
          '/api/signup',
          {

            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:JSON.stringify({

              name:name,

              email:email,

              password:password,

              phone:normalizedPhone,

              bloodGroup:bloodGroup

            })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.message ||
          'Unable to send OTP.'
        );

      }


      signupEmail =
        email;


      /*
        Hide signup form
      */

      signupForm.style.display =
        'none';


      /*
        Show OTP form
      */

      otpSection.classList.add(
        'show'
      );


      showMessage(
        'OTP sent successfully. Check your email.',
        'success'
      );


      document
        .getElementById('otp')
        .focus();


    }
    catch(error){

      showMessage(
        error.message,
        'error'
      );

      button.disabled =
        false;

      button.textContent =
        'Send OTP';

    }

  }
);


/* =========================
   OTP VERIFICATION
========================= */

otpForm.addEventListener(
  'submit',
  async function(event){

    event.preventDefault();


    const otp =
      document
        .getElementById('otp')
        .value
        .trim();


    if(!/^\d{6}$/.test(otp)){

      showMessage(
        'Please enter a valid 6-digit OTP.',
        'error'
      );

      return;

    }


    const button =
      document.getElementById(
        'verifyBtn'
      );


    button.disabled = true;

    button.textContent =
      'Verifying...';


    showMessage(
      'Verifying OTP...'
    );


    try{


      const response =
        await fetch(
          '/api/verify-otp',
          {

            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:JSON.stringify({

              email:signupEmail,

              otp:otp

            })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.message ||
          'OTP verification failed.'
        );

      }


      /*
        Save logged-in user
        in localStorage.
      */

      if(data.user){

        localStorage.setItem(
          'lifedropUser',
          JSON.stringify(
            data.user
          )
        );

      }


      showMessage(
        'Account created successfully! Redirecting...',
        'success'
      );


      /*
        Go to dashboard
      */

      setTimeout(
        () => {

          window.location.href =
            '/dashboard.html';

        },
        1000
      );


    }
    catch(error){

      showMessage(
        error.message,
        'error'
      );

      button.disabled =
        false;

      button.textContent =
        'Verify OTP & Create Account';

    }

  }
);


/* =========================
   OTP ONLY NUMBERS
========================= */

document
  .getElementById('otp')
  .addEventListener(
    'input',
    function(){

      this.value =
        this.value
          .replace(/\D/g,'')
          .slice(0,6);

    }
  );


</script>


</body>

</html>
